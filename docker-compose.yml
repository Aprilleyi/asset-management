services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "${ASSET_MANAGER_UID:-1000}:${ASSET_MANAGER_GID:-1000}"
    environment:
      ASSET_MANAGER_DATABASE_PATH: "${ASSET_MANAGER_DOCKER_DATABASE_PATH:-/srv/runtime/data/asset_test.sqlite3}"
      ASSET_MANAGER_BACKUP_DIR: /srv/runtime/backups
      ASSET_MANAGER_UPLOAD_DIR: /srv/runtime/uploads
      ASSET_MANAGER_OCR_CACHE_DIR: /srv/runtime/ocr-cache
      ASSET_MANAGER_SCHEDULER_ENABLED: "${ASSET_MANAGER_DOCKER_SCHEDULER_ENABLED:-false}"
      ASSET_MANAGER_SCHEDULER_TIMEZONE: Asia/Shanghai
      ASSET_MANAGER_API_HOST: 0.0.0.0
      ASSET_MANAGER_API_PORT: "8000"
      ASSET_MANAGER_CORS_ORIGINS: "[]"
      ASSET_MANAGER_OCR_PROVIDER: ${ASSET_MANAGER_OCR_PROVIDER:-none}
      ASSET_MANAGER_OCR_ENDPOINT: ${ASSET_MANAGER_OCR_ENDPOINT:-}
      ASSET_MANAGER_OCR_API_KEY: ${ASSET_MANAGER_OCR_API_KEY:-}
      ASSET_MANAGER_OCR_MODEL: ${ASSET_MANAGER_OCR_MODEL:-}
      ASSET_MANAGER_OCR_LOCAL_ENDPOINTS: "[]"
    volumes:
      - ./runtime:/srv/runtime
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3))['status'] == 'ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ASSET_MANAGER_FRONTEND_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
